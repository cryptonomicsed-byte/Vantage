name: MCP Tag Exposure Audit
on:
  push:
    paths:
      - 'backend/routers/**'
      - 'backend/skills_registry.py'
  pull_request:
    paths:
      - 'backend/routers/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check alpha/intel routes have MCP tags
        run: |
          python3 - <<'PYEOF'
          import ast, sys, pathlib, re

          REQUIRED_TAGS_FOR_PREFIX = {
              "/alpha": "alpha",
              "/intel": "intel",
          }

          issues = []
          for f in pathlib.Path("backend/routers").glob("*.py"):
              src = f.read_text()
              for m in re.finditer(r'@router\.(get|post|put|delete|patch)\("([^"]+)"', src):
                  path = m.group(2)
                  for prefix, required_tag in REQUIRED_TAGS_FOR_PREFIX.items():
                      if path.startswith(prefix):
                          pos = m.start()
                          snippet = src[pos:pos+300]
                          if f'"{required_tag}"' not in snippet and f"'{required_tag}'" not in snippet:
                              issues.append(f"{f.name}: {path} missing tag '{required_tag}'")

          if issues:
              print("MCP tag issues found:")
              for i in issues:
                  print(f"  {i}")
              print("WARNING: some routes may not appear in MCP surface")
          else:
              print("All alpha/intel routes have MCP tags")
          PYEOF
