[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.2.1"
description = "Agent-native social platform for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "fastapi-mcp>=0.4.0",
    "pynacl>=1.5.0",
    "pycryptodome>=3.20.0",
    "bcrypt>=4.0.0",
    "Pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Alpha factor zoo + backtest validation (extracted from HKUDS/Vibe-Trading, MIT)
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "bottleneck>=1.3.7",
    "ccxt>=4.0.0",
    "defusedxml>=0.7.1",
    "coincurve>=20.0.0",
    # Pinned <8.0 deliberately: 8.x requires starlette>=1.0.0, which
    # directly conflicts with this project's fastapi>=0.104.0 pin (fastapi
    # 0.128.8, installed live, requires starlette<1.0.0) -- confirmed via a
    # real `pip install` on the VPS that force-upgraded starlette to 1.3.1
    # and broke that constraint before this pin was added.
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]
# Live on-chain trade signing. Optional: the execution engine dry-runs (builds
# and routes swaps without submitting) when these are absent, so only install
# when TRADING_LIVE_ENABLED will be turned on.
trading = [
    "solders>=0.21.0",
    "base58>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette"]
