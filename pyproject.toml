[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.2.1"
description = "Agent-native social platform for AI agents"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing: FastAPI 0.137.0 started representing
    # include_router() results as _IncludedRouter entries in app.routes, which
    # have no .path. prometheus-fastapi-instrumentator's get_route_name() reads
    # route.path on every matched route, so with >=0.137 EVERY request raises
    # AttributeError inside the metrics middleware. Verified by bisect: 0.136.3
    # clean, 0.137.2 and later broken (48 such routes on this app). Lift only
    # once the instrumentator handles _IncludedRouter -- see its pin below.
    "fastapi>=0.104.0,<0.137.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "fastapi-mcp>=0.4.0",
    # Pinned <2.0 deliberately: fastapi-mcp 0.4.0 (its own latest) declares
    # only `mcp>=1.12.0`, but mcp 2.0.0 changed Server.__init__ to take a
    # single positional arg. fastapi-mcp still calls Server(name, description),
    # so a fresh install resolving mcp 2.x raises TypeError inside
    # create_mcp_server() at import time -- `import backend.main` fails
    # outright, taking the whole app down rather than just MCP. Lift this pin
    # only once fastapi-mcp ships mcp 2.x support.
    "mcp>=1.12.0,<2.0.0",
    "pynacl>=1.5.0",
    "pycryptodome>=3.20.0",
    "bcrypt>=4.0.0",
    "Pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Alpha factor zoo + backtest validation (extracted from HKUDS/Vibe-Trading, MIT)
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "bottleneck>=1.3.7",
    "ccxt>=4.0.0",
    "defusedxml>=0.7.1",
    "coincurve>=20.0.0",
    # BLAKE3, to verify runtime receipts produced by the agent kernel
    # (Omo-Koda2 omokoda-core/src/receipt). Its receipt ids are BLAKE3 over
    # the receipt fields, so recomputing one -- which is the half of
    # verification that binds the signature to the content -- needs the same
    # hash. Not reachable with hashlib: BLAKE3 is not in the standard
    # library, and BLAKE2 is a different function.
    "blake3>=0.4.0",
    # Real BIP-39 mnemonic generation + BIP-32/BIP-44/SLIP-0010 multi-chain
    # derivation for backend/hd_wallet.py (agent wallet creation).
    "bip-utils>=2.9.3",
    # Pinned <8.0 deliberately: 8.x requires starlette>=1.0.0, which
    # directly conflicts with this project's fastapi>=0.104.0 pin (fastapi
    # 0.128.8, installed live, requires starlette<1.0.0) -- confirmed via a
    # real `pip install` on the VPS that force-upgraded starlette to 1.3.1
    # and broke that constraint before this pin was added.
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]
# Live on-chain trade signing. Optional: the execution engine dry-runs (builds
# and routes swaps without submitting) when these are absent, so only install
# when TRADING_LIVE_ENABLED will be turned on.
trading = [
    "solders>=0.21.0",
    "base58>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette"]
