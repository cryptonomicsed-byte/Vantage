services:
  metabase:
    image: metabase/metabase:latest
    container_name: vantage_metabase
    restart: unless-stopped
    ports:
      # Bound to localhost only, same reasoning as ops/monitoring -- an
      # internal ops/business tool, not meant for public internet exposure.
      # Use an SSH tunnel (`ssh -L 3401:localhost:3401 ...`) for remote access.
      - "127.0.0.1:3401:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
      # NOT the live vantage.db (deliberately 600-permissioned to protect
      # wallet-encryption keys/hashes -- confirmed live that Metabase's
      # container user, uid 2000, can't read it, and loosening those
      # permissions isn't the right fix). refresh_mirror.sh maintains a
      # periodic read-only copy instead, owned by a host group matching
      # this container's uid -- see that script + its systemd timer.
      - ./vantage_mirror.db:/data/vantage.db:ro

volumes:
  metabase_data:
