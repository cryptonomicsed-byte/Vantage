services:
  metabase:
    image: metabase/metabase:latest
    container_name: vantage_metabase
    restart: unless-stopped
    ports:
      # Bound to localhost only, same reasoning as ops/monitoring -- an
      # internal ops/business tool, not meant for public internet exposure.
      # Use an SSH tunnel (`ssh -L 3401:localhost:3401 ...`) for remote access.
      - "127.0.0.1:3401:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
      # Read-only mount of the REAL live Vantage database. SQLite's WAL
      # mode (already how Vantage runs, see backend/db.py) supports
      # concurrent readers alongside the writer by design, so this is safe
      # -- and :ro at the mount level means Metabase's own JDBC driver
      # can't write to it even if something tried.
      - /opt/ares/Vantage/data/vantage.db:/data/vantage.db:ro

volumes:
  metabase_data:
