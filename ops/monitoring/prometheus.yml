global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Vantage runs on bare metal on this same host (systemd, port 8001), not
  # in this compose network -- host-gateway (extra_hosts below) reaches it
  # the same way on Linux and Docker Desktop.
  - job_name: vantage_backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
